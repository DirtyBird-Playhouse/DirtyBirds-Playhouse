[pytest]
testpaths = tests
# This machine's default temp (%LOCALAPPDATA%\Temp\pytest-of-*) denies pytest's
# tmp_path/cache writes (WinError 5), which errored out ~8 tests unrelated to any
# code change. Redirect both to a repo-local, gitignored dir and disable the
# cache plugin so `pytest` runs clean out of the box.
addopts = -p no:cacheprovider --basetemp=.pytest_tmp
